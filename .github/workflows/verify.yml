name: Verify website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:seo
      - run: npm test
      - run: node tests/preview-indexing.mjs
      - run: npm run build
        env:
          PUBLIC_SITE_INDEXABLE: 'true'
      - run: npm run test:search
      - run: node tests/security-content.mjs
